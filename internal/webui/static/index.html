<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Trove</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <button id="menu" class="icon-btn only-narrow" type="button" aria-controls="side" aria-expanded="false" hidden>Files</button>
  <a class="brand" href="#/">Trove</a>
  <nav id="nav" hidden>
    <a id="nav-read" href="#/">Read</a>
    <a id="nav-review" href="#/review" hidden>Approvals <span id="pending-count" class="count"></span></a>
    <a id="nav-account" href="#/account">Account</a>
  </nav>
  <span class="spacer"></span>
  <span id="who" class="who" hidden></span>
  <button id="lock" class="btn small" type="button" hidden>Sign out</button>
</header>

<noscript>JavaScript is required to use the Trove interface.</noscript>

<main id="login" class="login" hidden>
  <h1>Trove</h1>
  <p id="login-description">Loading sign-in...</p>
  <p id="https-note" class="banner error" hidden>This server requires HTTPS to sign in. Open the HTTPS address.</p>
  <div id="setup-fields" class="login-fields" hidden>
    <label for="owner-token">Owner token (first setup only)</label>
    <input id="owner-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div id="confirm-fields" class="login-fields" hidden>
    <label for="password-confirm">Password again (15 to 128 characters)</label>
    <input id="password-confirm" type="password" autocomplete="new-password">
  </div>
  <button id="login-btn" class="btn primary" type="button" disabled>Sign in</button>
  <p id="login-error" class="error" role="alert"></p>
  <p class="fineprint">Use your own trusted browser for owner access. Sign out when you finish on a shared device.</p>
</main>

<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <input id="filter" type="search" placeholder="Filter file names" aria-label="Filter file names" autocomplete="off" spellcheck="false">
    <div class="search-row">
      <input id="search" type="search" placeholder="Search content" aria-label="Search content" autocomplete="off" spellcheck="false">
      <button id="search-btn" class="btn small" type="button">Search</button>
    </div>
    <nav id="tree" class="tree" aria-label="Knowledge base files"></nav>
  </aside>
  <section id="view" class="view" aria-live="polite"></section>
</div>
</body>
</html>
