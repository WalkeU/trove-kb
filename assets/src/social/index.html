<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=640" />
    <title>Trove social preview</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cascadia Mono";
        src: url("../hero/fonts/CascadiaMono.ttf") format("truetype");
        font-weight: 200 700;
      }
      html,
      body {
        margin: 0;
        background: #101114;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101114;
        color: #ebe5d6;
        font-family: "Cascadia Mono", monospace;
      }
      #grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(#2c2f36 1px, transparent 1px), linear-gradient(90deg, #2c2f36 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.2;
      }
      #brand {
        position: absolute;
        left: 96px;
        top: 150px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #brand svg {
        display: block;
      }
      #claim {
        position: absolute;
        left: 96px;
        top: 282px;
        font-size: 40px;
        line-height: 56px;
        width: 1100px;
      }
      #claim .b {
        color: #e3a83c;
      }
      #sub {
        position: absolute;
        left: 96px;
        top: 444px;
        font-size: 24px;
        color: #a19d93;
        letter-spacing: 0.02em;
      }
      #chain {
        position: absolute;
        left: 96px;
        bottom: 72px;
        display: flex;
        align-items: center;
        gap: 0;
        font-size: 20px;
      }
      .c {
        border: 2px solid #2c2f36;
        border-radius: 8px;
        padding: 8px 16px;
        background: #17181c;
        display: block;
      }
      .c.on {
        border-color: #e3a83c;
        color: #e3a83c;
      }
      .ln {
        width: 36px;
        height: 2px;
        background: #e3a83c;
        display: block;
      }
      #alpha {
        position: absolute;
        right: 96px;
        top: 64px;
        font-size: 18px;
        letter-spacing: 0.16em;
        color: #e4714f;
        border: 2px solid #e4714f;
        border-radius: 6px;
        padding: 6px 14px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="640" data-duration="1">
      <div id="grid"></div>
      <div id="alpha">ALPHA</div>
      <div id="brand">
        <svg width="316" height="96" viewBox="-6 34 520 158" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M28 48V146a30 30 0 0 0 30 30h8M8 80H70M104 176V80M104 130a50 50 0 0 1 50-50h6M184 128a50 50 0 1 0 100 0a50 50 0 1 0-100 0M404 128H500a48 48 0 1 0-11.2 30.8" stroke="#ebe5d6" />
          <path d="M314 110L342 176L380 80" stroke="#e3a83c" />
        </svg>
      </div>
      <div id="claim">A knowledge base AI agents read, <span class="b">but only humans can change.</span></div>
      <div id="sub">proposals, digest-bound approval, hash-chained audit, MCP. one Go binary.</div>
      <div id="chain">
        <span class="c">propose</span><span class="ln"></span><span class="c">validate</span><span class="ln"></span><span class="c on">approve --digest</span><span class="ln"></span><span class="c">commit</span>
      </div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
